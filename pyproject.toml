[project]
name = "data_logger"
authors = [
  { name="Patrick Baus", email="patrick.baus@physik.tu-darmstadt.de" },
]
description = "Python3 AsyncIO data logger"
readme = "README.md"
license = "GPL-3.0-or-later"
requires-python = ">=3.11"
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Development Status :: 5 - Production/Stable",
    "Operating System :: OS Independent",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Natural Language :: English",
    "Topic :: Scientific/Engineering",
]
keywords = ["data logger", "GPIB", ]
dynamic = ["version"]
dependencies = [
    "aiofiles",
    "aiomqtt",
    "pydantic",
    "pyserial-asyncio",
    "PyYAML",
    "simplejson",
    "tinkerforge-async",
    "async-gpib",
    "prologix-gpib-async"
]

[project.urls]
"Homepage" = "https://github.com/PatrickBaus/data_logger"
"Bug Tracker" = "https://github.com/PatrickBaus/data_logger/issues"
"Download" = "https://github.com/PatrickBaus/data_logger/releases"

[project.optional-dependencies]
dev = [
    "black", "build", "isort", "mypy", "pre-commit", "pylint", "pytest", "twine",
]

test = [
    "mypy", "pylint", "pytest", "setuptools",
]

[tool.pylint.'MESSAGES CONTROL']
max-line-length = 120

[tool.isort]
line_length = 120
profile = "black"

[tool.black]
line-length = 120

[tool.pytest.ini_options]
markers = [
    # conftest.py reorders tests moving slow ones to the end of the list
    "slow",
]

[build-system]
requires = [
    "setuptools>=84.2.1",
]
build-backend = "setuptools.build_meta"

# The logger is an application, not a library. These are the modules and packages of the flat layout. They are listed
# explicitly, because the automatic discovery refuses a flat layout with several top-level packages.
[tool.setuptools]
py-modules = ["_version", "data_logger", "errors"]
packages = ["devices", "endpoints", "factories", "logger"]

[tool.setuptools.dynamic]
# Read from _version.py. "data_logger.__version__" would import data_logger.py, which is the application itself.
version = {attr = "_version.__version__"}
